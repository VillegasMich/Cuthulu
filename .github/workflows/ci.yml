name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to Docker Hub (only on a release tag, e.g. v1.2.3)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --locked

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --document-private-items --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  scripts:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # shellcheck is preinstalled on the runner.
      - run: shellcheck scripts/*.sh
      - run: scripts/test-companions.sh

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: crate-ci/typos@v1

  docker:
    # PRs and pushes: build + smoke test + dry-run push (tags computed, nothing uploaded).
    # Published releases, and manual runs on a v* tag with `publish` (how release.yml publishes,
    # since its GITHUB_TOKEN release fires no event): the same, then a linux/amd64 + linux/arm64
    # push to Docker Hub. See docs/DEPLOYMENT.md#releasing.
    name: docker build (smoke test, push on release)
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    env:
      PUBLISH: ${{ github.event_name == 'release' || (inputs.publish == true && startsWith(github.ref, 'refs/tags/v')) }}
      # Docker Hub repository, e.g. "villegasmich/cuthulu". See docs/DEPLOYMENT.md.
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/cuthulu', vars.DOCKERHUB_USERNAME || 'local') }}
    steps:
      - uses: actions/checkout@v5
      # No QEMU: the Dockerfile cross-compiles arm64 on the runner (see its build stage).
      - uses: docker/setup-buildx-action@v4
      - name: check tag matches Cargo.toml
        if: env.PUBLISH == 'true'
        run: |
          version=$(scripts/bump-version.sh)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml's version $version (expected v$version)"
            exit 1
          fi
      - name: compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Releases: 1.2.3, 1.2 and latest (latest is skipped for pre-releases).
          # Otherwise: pr-<n>, branch name and sha-<short>, which are never pushed.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=ref,event=branch
            type=sha
      - name: build image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cuthulu:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        run: |
          docker run --rm cuthulu:ci --version
          test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' cuthulu:ci)" = "$GITHUB_SHA"
          docker run -d --name cuthulu-smoke -v /var/run/docker.sock:/var/run/docker.sock \
            --group-add "$(stat -c %g /var/run/docker.sock)" -p 127.0.0.1:8686:8686 cuthulu:ci
          # The server answers before the first Docker list completes; wait for both.
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:8686/api/services?q=cuthulu-smoke" | grep -q '"is_self":true' && break
            sleep 0.5
          done
          curl -fsS "http://127.0.0.1:8686/api/services?q=cuthulu-smoke" | grep -q '"is_self":true'
          docker exec cuthulu-smoke /cuthulu healthcheck
          id=$(curl -fsS "http://127.0.0.1:8686/api/services?q=cuthulu-smoke" | grep -o '"id":"[^"]*"' | cut -d'"' -f4)
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-Cuthulu: 1' "http://127.0.0.1:8686/api/services/$id/stop")" = 403
          # The build reports Cargo.toml's version and the injected commit.
          version=$(scripts/bump-version.sh)
          curl -fsS http://127.0.0.1:8686/api/version | grep -qF "{\"version\":\"$version\",\"git_sha\":\"$GITHUB_SHA\"}"
          page=$(curl -fsS http://127.0.0.1:8686/)
          grep -qF "v$version" <<<"$page"
          grep -qF "${GITHUB_SHA::7}" <<<"$page"
          docker logs cuthulu-smoke
          docker rm -f cuthulu-smoke
      - name: dry-run push
        if: env.PUBLISH != 'true'
        run: |
          {
            echo "### Docker push (dry run)"
            echo "Nothing was pushed. Tags this build would get (releases get version tags + latest):"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
      - name: check Docker Hub settings
        if: env.PUBLISH == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret (docs/DEPLOYMENT.md)"
            exit 1
          fi
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build and push (linux/amd64, linux/arm64)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
