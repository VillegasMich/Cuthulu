# Cuthulu itself: scripts/install.sh installs it, so it is never suggested as a companion. It is
# listed so readers of the catalog (e.g. mapping a container to its unit and env file) see it too.
NAME=cuthulu
DESCRIPTION=Self-hosted dashboard to monitor and control the services on this machine.
REPO=https://github.com/VillegasMich/cuthulu
IMAGE=villegasmich/cuthulu
CONTAINER=cuthulu
UNIT=cuthulu
UNIT_SCOPE=system
ENV_FILE=/etc/cuthulu/.env
SUGGEST=false
