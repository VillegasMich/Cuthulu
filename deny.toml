# cargo-deny: licenses, security advisories, duplicate/banned crates, sources.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    # TLS for notifications (rustls, ring, webpki, Mozilla roots) and lettre's quoted_printable.
    "ISC",
    "CDLA-Permissive-2.0",
    "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# TLS (SMTP, healthcheck pings) is rustls with bundled roots; keep native crypto out.
deny = [
    { crate = "openssl-sys" },
    { crate = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
